app:
  companyName: "Aesthetic Indians"
  supportEmail: "essenbeats@gmail.com"
  supportPhone: "+91 9953062283"
  address: "Netanya No. 9 (Old No. 150), Borewell Layout, Bangalore, Karnataka 560001"
  grievanceOfficer: "Sahib Nanda"
  storeURL: "${STORE_URL}"

policies:
  effectiveDate: "2026-11-13"
  returnWindowDays: 7
  refundDays: "5–7"
  dispatchDays: "1–3"
  deliveryDays: "5–7"
  freeShippingAbove: 999
  shippingFee: 79

server:
  port: 3000

cors:
  frontendPort: 4073

token:
  secret: "${TOKEN_SECRET}"

admin:
  key: "${ADMIN_KEY}"

storage:
  directory: "${DATA_DIR}"
  permission: "0600"
  usersFile: "users.db"
  productsFile: "products.db"
  imagesFile: "images.db"
  cartsFile: "carts.db"
  ordersFile: "orders.db"
  addressesFile: "addresses.db"

users:
  isOneValidationEnough: true

smtp:
  senders:
    - email: "${SMTP_SENDER_1_EMAIL}"
      host: "smtp.gmail.com"
      port: 587
      username: "${SMTP_SENDER_1_USERNAME}"
      password: "${SMTP_SENDER_1_PASSWORD}"
      security: "starttls"
      timeout: 25s
    - email: "${SMTP_SENDER_2_EMAIL}"
      host: "smtp.gmail.com"
      port: 587
      username: "${SMTP_SENDER_2_USERNAME}"
      password: "${SMTP_SENDER_2_PASSWORD}"
      security: "starttls"
      timeout: 25s

otp:
  email:
    length: 6
    ttl: 5m
    resendCooldown: 1m
    maxAttempts: 5
    capacity: 100000
    subject: "Aesthetic Indians - OTP Verification"

rateLimit:
  cacheSize: 10000
  ttl: 10m
  rules:
    auth: {requestsPerMinute: 20, burst: 5}
    otp: {requestsPerMinute: 3, burst: 2}
    catalog: {requestsPerMinute: 240, burst: 60}
    images: {requestsPerMinute: 600, burst: 120}
    cart: {requestsPerMinute: 120, burst: 30}
    admin: {requestsPerMinute: 60, burst: 20}
    info: {requestsPerMinute: 120, burst: 40}
    orders: {requestsPerMinute: 60, burst: 20}
    payments: {requestsPerMinute: 120, burst: 40}

payments:
  provider: "SELF_UPI"
  paymentsFile: "payments.db"
  queueFile: "payments_queue.db"
  instamojo:
    baseURL: "https://api.instamojo.com"
    clientID: "${INSTAMOJO_CLIENT_ID}"
    clientSecret: "${INSTAMOJO_CLIENT_SECRET}"
    privateSalt: "${INSTAMOJO_PRIVATE_SALT}"
    timeout: 15s
    pollInterval: 15s
    pollWindow: 10m
    leaseTimeout: 30s
    concurrency: 4
    redirectURL: "${STORE_URL}/payments/return"
    webhookURL: "${STORE_URL}/v1/payments/webhook"
  upi:
    payeeName: "Aesthetic Indians"
